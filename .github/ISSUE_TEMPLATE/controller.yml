name: Controller report
description: Tell us how a controller works (or doesn't) with padnamer
labels: ["controller"]
body:
  - type: input
    id: controller
    attributes:
      label: Controller
      description: Make and model, e.g. "8BitDo Ultimate 2", "NSO N64 controller"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: ["Bluetooth", "USB cable", "USB dongle"]
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works?
      options:
        - label: Detected as the right model
        - label: Renamed and shows in the player order
        - label: Buttons and sticks work in emulators
        - label: Rumble works ("Find" buzzes it)
        - label: Player lights / light bar show the player number
        - label: Disconnect switches it off
  - type: textarea
    id: list
    attributes:
      label: Output of `padnamer list`
      description: Run it in Desktop Mode (Konsole) with the controller connected
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Anything else
